<header class="apple-navbar fixed-top">
  <div class="container navbar-inner">

      <span class="brand-full-name">Surendar<span class="brand-dot">.</span></span>
    </a>

    <!-- Desktop Nav Links -->
    <nav class="desktop-nav-links d-none d-md-flex align-items-center gap-4">
      <a href="#projects" class="nav-link-item" [class.active]="activeSection === 'projects'">Projects</a>
      <a href="#skills" class="nav-link-item" [class.active]="activeSection === 'skills'">Skills</a>
      <a href="#experience" class="nav-link-item" [class.active]="activeSection === 'experience'">Experience</a>

      <button class="mobile-menu-btn d-md-none" (click)="toggleMobileMenu()" [class.open]="isMobileMenuOpen" aria-label="Toggle menu">

      <a href="#projects" class="mobile-nav-item" (click)="closeMobileMenu()">Projects</a>
      <a href="#skills" class="mobile-nav-item" (click)="closeMobileMenu()">Skills</a>
      <a href="#experience" class="mobile-nav-item" (click)="closeMobileMenu()">Experience</a>
      <a href="#contact" class="mobile-nav-item" (click)="closeMobileMenu()">Contact</a>
